# SPDX-License-Identifier: MIT
#
# Runs on x86_64-linux and aarch64-linux: the flake's checks (the CLI
# build, the unit tests, the sandboxed builds of the fixtures under
# tests/fixtures and a run of each, the negative checks, and the
# formatting), then tests/interactive.sh for what runs outside the sandbox
# (the lock run, `cabal`, `publish` and the errors for damaged lockfiles),
# tests/vcs.sh for Mercurial and Darcs source repositories, and
# tests/editor.sh for the language server in the offline mode.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
      - run: tests/interactive.sh
      - run: tests/vcs.sh
      - run: tests/editor.sh
