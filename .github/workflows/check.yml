# SPDX-License-Identifier: MIT
#
# Runs on x86_64-linux, aarch64-linux and aarch64-darwin: the flake's checks (the CLI
# build, the unit tests, the sandboxed builds of the fixtures and of
# ShellCheck, and the conformance checks the sandbox can run), then the
# conformance checks that need the network or Nix itself, as steps named
# like the contract's checks: conformance-relock, conformance-rebuild,
# conformance-offline and conformance-update. tests/interactive.sh covers
# the errors and `publish`, and tests/vcs.sh the Mercurial and Darcs
# source repositories.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            sandbox = true
      - run: nix flake check -L
      - name: conformance-relock
        run: tests/conformance-relock.sh
      - name: conformance-rebuild
        run: tests/conformance-rebuild.sh
      - name: conformance-offline
        run: tests/conformance-offline.sh
      - name: conformance-update
        run: tests/conformance-update.sh
      - run: tests/interactive.sh
      - run: tests/vcs.sh
